<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خريطة كود Rising StarAi</title>
<style>
  :root { color-scheme: dark; --bg:#07070f; --panel:#11121c; --line:#262838; --text:#eceef7; --muted:#9aa0b8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 system-ui, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  canvas { width: 100%; height: 100vh; display: block; cursor: grab; }
  aside { border-inline-start: 1px solid var(--line); background: var(--panel); padding: 14px; overflow: auto; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  input { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: #0b0c14; color: var(--text); font: inherit; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; font-size: 12px; color: var(--muted); }
  .legend label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .muted { color: var(--muted); font-size: 12px; }
  ul { padding-inline-start: 18px; margin: 4px 0 12px; }
  li { cursor: pointer; word-break: break-all; }
  li:hover { color: #8fb0ff; }
  code { font-size: 12px; direction: ltr; unicode-bidi: embed; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; } canvas { height: 60vh; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<aside>
  <h1>خريطة كود Rising StarAi</h1>
  <p class="muted" id="count"></p>
  <input id="q" placeholder="دوّر على ملف أو مسار أو مفتاح…" autocomplete="off">
  <div class="legend" id="legend"></div>
  <div id="info"><p class="muted">اضغط على أي نقطة تشوف هي بتعتمد على إيه ومين بيتأثر بيها. اسحب الخريطة، وكبّر بالعجلة.</p></div>
</aside>
<script>
const DATA = /*DATA*/null;
const COLORS = { page: "#5fd39a", api: "#ffb547", component: "#7aa2ff", lib: "#e277ff", app: "#9aa0b8", style: "#4a4f66", other: "#9aa0b8" };
const NAMES = { page: "صفحات", api: "API", component: "مكوّنات", lib: "مكتبات", app: "إعدادات", style: "CSS", other: "أخرى" };
const hidden = new Set(["style"]);
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const byId = {}, out = {}, inn = {};
const N = DATA.nodes.map((n, i) => (byId[n.id] = { ...n, x: Math.cos(i) * 300 * Math.random(), y: Math.sin(i) * 300 * Math.random(), vx: 0, vy: 0 }));
for (const e of DATA.edges) { (out[e.from] ||= []).push(e.to); (inn[e.to] ||= []).push(e.from); }
const E = DATA.edges.map((e) => [byId[e.from], byId[e.to]]).filter(([a, b]) => a && b);
document.getElementById("count").textContent = `${N.length} ملف · ${E.length} علاقة`;
let sel = null, hits = new Set(), view = { x: 0, y: 0, k: 0.7 };
const vis = (n) => !hidden.has(n.kind);
const r = (n) => 3 + Math.sqrt(n.usedBy || 0) * 1.6;

const lg = document.getElementById("legend");
for (const k of Object.keys(NAMES)) {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" ${hidden.has(k) ? "" : "checked"} style="width:auto"><i style="background:${COLORS[k]}"></i>${NAMES[k]}`;
  l.querySelector("input").onchange = (e) => { e.target.checked ? hidden.delete(k) : hidden.add(k); heat = 1; };
  lg.appendChild(l);
}

let heat = 1;
function tick() {
  const V = N.filter(vis);
  for (let i = 0; i < V.length; i++) for (let j = i + 1; j < V.length; j++) {
    const a = V[i], b = V[j]; let dx = a.x - b.x, dy = a.y - b.y; let d2 = Math.max(25, dx * dx + dy * dy);
    if (d2 > 90000) continue; const f = 900 / d2; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
  }
  for (const [a, b] of E) { if (!vis(a) || !vis(b)) continue; const dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 1; const f = (d - 60) * 0.004; a.vx += dx / d * f * d * 0.1; a.vy += dy / d * f * d * 0.1; b.vx -= dx / d * f * d * 0.1; b.vy -= dy / d * f * d * 0.1; }
  for (const n of V) { n.vx = Math.max(-30, Math.min(30, n.vx)); n.vy = Math.max(-30, Math.min(30, n.vy)); n.vx -= n.x * 0.002; n.vy -= n.y * 0.002; n.x += n.vx * heat; n.y += n.vy * heat; n.vx *= 0.55; n.vy *= 0.55; }
  heat = Math.max(0.02, heat * 0.985);
}
function draw() {
  const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio * view.k, 0, 0, devicePixelRatio * view.k, w / 2 + view.x * devicePixelRatio, h / 2 + view.y * devicePixelRatio);
  const near = sel ? new Set([sel.id, ...(out[sel.id] || []), ...(inn[sel.id] || [])]) : null;
  for (const [a, b] of E) {
    if (!vis(a) || !vis(b)) continue;
    const on = sel && (a === sel || b === sel);
    ctx.strokeStyle = on ? (a === sel ? "rgba(122,162,255,.9)" : "rgba(255,181,71,.9)") : sel ? "rgba(255,255,255,.03)" : "rgba(255,255,255,.07)";
    ctx.lineWidth = on ? 1.4 / view.k : 0.6 / view.k; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const n of N) {
    if (!vis(n)) continue;
    const dim = (near && !near.has(n.id)) || (hits.size && !hits.has(n.id));
    ctx.globalAlpha = dim ? 0.15 : 1; ctx.fillStyle = COLORS[n.kind] || "#999";
    ctx.beginPath(); ctx.arc(n.x, n.y, r(n), 0, 7); ctx.fill();
    if (!dim && (n === sel || (near && near.has(n.id)) || hits.has(n.id) || n.usedBy > 12)) {
      ctx.direction = "ltr"; ctx.fillStyle = "#eceef7"; ctx.font = `${11 / view.k}px system-ui`; ctx.textAlign = "center";
      ctx.fillText(n.url || n.id.replace(/^(components|lib|app)\//, ""), n.x, n.y - r(n) - 3 / view.k);
    }
  }
  ctx.globalAlpha = 1;
}
(function loop() { tick(); draw(); requestAnimationFrame(loop); })();

function toWorld(e) { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left - b.width / 2 - view.x) / view.k, y: (e.clientY - b.top - b.height / 2 - view.y) / view.k }; }
let drag = null;
cv.onpointerdown = (e) => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false }; };
window.onpointermove = (e) => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true; view.x = drag.vx + dx; view.y = drag.vy + dy; };
window.onpointerup = (e) => {
  if (drag && !drag.moved && e.target === cv) {
    const p = toWorld(e); let best = null, bd = 1e9;
    for (const n of N) { if (!vis(n)) continue; const d = Math.hypot(n.x - p.x, n.y - p.y); if (d < bd && d < r(n) + 8 / view.k) { bd = d; best = n; } }
    pick(best);
  }
  drag = null;
};
cv.onwheel = (e) => { e.preventDefault(); view.k = Math.min(4, Math.max(0.15, view.k * (e.deltaY < 0 ? 1.12 : 0.89))); };

function reach(id, map) { const s = new Set(), q = [id]; while (q.length) for (const x of map[q.shift()] || []) if (!s.has(x) && x !== id) { s.add(x); q.push(x); } return s; }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function list(ids) { return `<ul>${ids.map((x) => `<li data-id="${esc(x)}"><code>${esc(x)}</code></li>`).join("")}</ul>`; }
function pick(n) {
  sel = n; const info = document.getElementById("info");
  if (!n) { info.innerHTML = '<p class="muted">اضغط على أي نقطة.</p>'; return; }
  const up = [...reach(n.id, inn)];
  info.innerHTML = `<h1><code>${esc(n.id)}</code></h1>${n.url ? `<p>الرابط: <code>${esc(n.url)}</code></p>` : ""}${n.about ? `<p>${esc(n.about)}</p>` : ""}${n.env ? `<p class="muted">مفاتيح: ${n.env.map(esc).join("، ")}</p>` : ""}
    <p><b>بيعتمد على</b> (${(out[n.id] || []).length})</p>${list(out[n.id] || [])}
    <p><b>بيستخدمه مباشرةً</b> (${(inn[n.id] || []).length})</p>${list(inn[n.id] || [])}
    <p class="muted">لو عدّلته بيتأثر ${up.length} ملف، منهم ${up.filter((x) => ["page", "api"].includes(byId[x]?.kind)).length} صفحة ومسار API.</p>`;
  info.querySelectorAll("li").forEach((li) => (li.onclick = () => { const m = byId[li.dataset.id]; if (m) { pick(m); view.x = -m.x * view.k; view.y = -m.y * view.k; } }));
}
document.getElementById("q").oninput = (e) => {
  const q = e.target.value.trim().toLowerCase(); hits = new Set();
  if (q) for (const n of N) if (n.id.toLowerCase().includes(q) || (n.url || "").includes(q) || (n.about || "").toLowerCase().includes(q) || (n.env || []).some((x) => x.toLowerCase().includes(q))) hits.add(n.id);
};
</script>
</body>
</html>
