name: makers-probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-audit --no-fund cheerio@1.0.0 sharp@0.33.5
      - run: node scripts/makers/probe.mjs 2>&1 | tee data/makers-probe.log
      - if: always()
        run: |
          git config user.name "rising-star-bot" && git config user.email "bot@users.noreply.github.com"
          git add -f data/makers-probe.json data/makers-probe.log public/maker-logos
          git commit -m "makers: probe results" || exit 0
          git pull --rebase -q origin main && git push
