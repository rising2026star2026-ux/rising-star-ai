# أخبار الذكاء الاصطناعي: بتتحدّث لوحدها كل يوم وVercel بينشر بعد الـ commit
name: ai-news
on:
  schedule:
    - cron: "23 4,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-news
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-audit --no-fund cheerio@1.0.0
      - run: node scripts/news/fetch.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - if: always()
        run: |
          git config user.name "rising-star-bot" && git config user.email "bot@users.noreply.github.com"
          git add data/news
          git commit -m "news: daily update" || exit 0
          git pull --rebase -q origin main && git push
