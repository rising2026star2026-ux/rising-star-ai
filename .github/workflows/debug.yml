name: debug-client-errors
on:
  push:
    branches: [ci-debug]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node ci/pollcheck.mjs > ci/pollcheck.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name ci && git config user.email ci@example.com
          git add -f ci
          git commit -m "ci results [skip ci]" && git push
